<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LogWatch | general</title>
    <link rel="stylesheet" href="/web/main.css">
</head>
<body class="general-page">
    <aside id="navbar" class="sidebar" aria-label="Hauptnavigation">
        <a class="brand" href="/" aria-label="LogWatch Startseite">
            <img class="brand-icon" src="/web/assets/logo.svg" alt="LogWatch">
            <span>LogWatch</span>
        </a>
        <nav class="navigation">
            <a class="nav-item" href="/">Processes</a>
            <a class="nav-item active" href="/general" aria-current="page">general</a>
        </nav>
    </aside>

    <main>
        <header id="header">
            <h1>System information</h1>
            <div class="toolbar">
                <span id="load-status" role="status" aria-live="polite"></span>
                <button id="reload-system" type="button">Reload</button>
            </div>
        </header>
        <section id="system-info" class="system-grid" aria-label="System information" aria-live="polite">
            <p class="state-message">Loading system information...</p>
        </section>
    </main>
    <div class="right-rail" aria-hidden="true">vvvvv</div>

    <script src="/web/general.js"></script>
</body>
</html>
